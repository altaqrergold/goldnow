name: Inspect legacy GoldNow Auto Posts archive
on:
  push:
    branches:
      - feature/goldnow-multilingual-manager
    paths:
      - '.github/workflows/inspect-goldnow-auto-posts.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract legacy PHP sources
        run: |
          mkdir -p legacy-inspection
          unzip -l goldnow-auto-posts.zip > legacy-inspection/archive-list.txt
          unzip -o goldnow-auto-posts.zip '*.php' -d legacy-inspection/source
          find legacy-inspection/source -type f -name '*.php' -print
          find legacy-inspection/source -type f -name '*.php' -exec sh -c 'for f do echo "===== $f ====="; cat "$f"; done' sh {} + > legacy-inspection/all-php-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-goldnow-auto-posts-source
          path: legacy-inspection/
          retention-days: 2
