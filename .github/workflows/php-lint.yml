name: PHP syntax checks

on:
  push:
    branches: [main]
    paths:
      - 'goldnow-multilingual-routes.php'
      - 'goldnow-language-manager.php'
      - 'goldnow-seo-content.php'
      - 'tests/test-seo-renderer.php'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - 'goldnow-multilingual-routes.php'
      - 'goldnow-language-manager.php'
      - 'goldnow-seo-content.php'
      - '.github/workflows/php-lint.yml'

permissions:
  contents: write

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Inspect current plugin archive layout
        run: unzip -l goldnow-language-manager.zip
      - name: Lint changed PHP source files
        run: |
          php -l goldnow-multilingual-routes.php
          php -l goldnow-language-manager.php
          php -l goldnow-seo-content.php
          php tests/test-seo-renderer.php

      - name: Rebuild plugin ZIP with SEO module
        run: |
          rm -rf dist
          mkdir -p dist/goldnow-language-manager
          cp goldnow-language-manager.php goldnow-seo-content.php dist/goldnow-language-manager/
          (cd dist && zip -qr ../goldnow-language-manager.zip goldnow-language-manager)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goldnow-language-manager.zip
          if ! git diff --cached --quiet; then
            git commit -m "Build GoldNow Language Manager v1.2.0 package"
            git push
          fi
          unzip -t goldnow-language-manager.zip
          rm -rf package-check
          unzip -q goldnow-language-manager.zip -d package-check
          php -l package-check/goldnow-language-manager/goldnow-language-manager.php
          php -l package-check/goldnow-language-manager/goldnow-seo-content.php
