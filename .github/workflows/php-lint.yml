name: PHP syntax checks

on:
  push:
    branches:
      - work/multilingual-auto-posts-15-languages
    paths:
      - 'goldnow-multilingual-routes.php'
      - 'goldnow-language-manager.php'
      - 'goldnow-seo-content.php'
      - 'goldnow-seo-admin.php'
      - 'goldnow-seo-shortcode.php'
      - 'tests/test-seo-renderer.php'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - 'goldnow-multilingual-routes.php'
      - 'goldnow-language-manager.php'
      - 'goldnow-seo-content.php'
      - 'goldnow-seo-admin.php'
      - 'goldnow-seo-shortcode.php'
      - 'tests/test-seo-renderer.php'
      - '.github/workflows/php-lint.yml'

permissions:
  contents: read

concurrency:
  group: goldnow-php-lint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP source files
        run: |
          php -l goldnow-multilingual-routes.php
          php -l goldnow-language-manager.php
          php -l goldnow-seo-content.php
          php -l goldnow-seo-admin.php
          php -l goldnow-seo-shortcode.php
          php -l tests/test-seo-renderer.php

      - name: Run SEO renderer tests
        run: php tests/test-seo-renderer.php

      - name: Build and validate Language Manager ZIP
        run: |
          rm -rf dist package-check
          mkdir -p dist/goldnow-language-manager
          cp goldnow-language-manager.php goldnow-seo-content.php goldnow-seo-admin.php goldnow-seo-shortcode.php dist/goldnow-language-manager/
          (cd dist && zip -qr ../goldnow-language-manager.zip goldnow-language-manager)
          unzip -t goldnow-language-manager.zip
          unzip -q goldnow-language-manager.zip -d package-check
          php -l package-check/goldnow-language-manager/goldnow-language-manager.php
          php -l package-check/goldnow-language-manager/goldnow-seo-content.php
          php -l package-check/goldnow-language-manager/goldnow-seo-admin.php
          php -l package-check/goldnow-language-manager/goldnow-seo-shortcode.php

      - name: Upload validated plugin package
        uses: actions/upload-artifact@v4
        with:
          name: goldnow-language-manager
          path: goldnow-language-manager.zip
          if-no-files-found: error
