name: Validate and package GoldNow Multilingual Manager

on:
  push:
    branches:
      - feature/goldnow-multilingual-manager
    paths:
      - 'goldnow-multilingual-manager/**'
      - '.github/workflows/validate-gnmm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint all plugin PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find goldnow-multilingual-manager -type f -name '*.php' -print0)

      - name: Verify bundled SEO dictionary defines the required function
        run: |
          grep -q "function goldnow_seo_article_data" goldnow-multilingual-manager/includes/goldnow-seo-content.php

      - name: Verify plugin root and files
        run: |
          set -euo pipefail
          test -f goldnow-multilingual-manager/goldnow-multilingual-manager.php
          find goldnow-multilingual-manager -type f -maxdepth 3 -print

      # Upload the plugin directory, not a ZIP nested inside the artifact ZIP.
      # The downloaded Actions artifact is then directly installable by WordPress.
      - name: Upload installable plugin folder
        uses: actions/upload-artifact@v4
        with:
          name: goldnow-multilingual-manager-0.1.6
          path: goldnow-multilingual-manager/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
