name: PHP lint for five rebuilt locales

on:
  push:
    branches:
      - work/rebuild-five-locales
    paths:
      - 'taxonomy-countries-*.php'
      - '.github/workflows/php-lint-rebuild.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint rebuilt locale templates
        run: |
          for file in taxonomy-countries-th.php taxonomy-countries-vi.php taxonomy-countries-id.php taxonomy-countries-ja.php taxonomy-countries-ko.php; do
            php -l "$file"
          done
